  <title id="page-title">Custom Protocol Terminal</title>

  <!-- Local or CDN Xterm CSS -->
  <link rel="stylesheet" href="css/xterm.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
    }
    #controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 100;
      display: flex;
      gap: 8px;
    }
    button {
      background: #333;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 12px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #444; }
    #terminal-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
    </style> <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

  <div id="controls">
    <button id="btn-pause">Pause ('2')</button>
    <button id="btn-resume">Resume ('3')</button>
  </div>
  <div id="terminal-container"></div>
